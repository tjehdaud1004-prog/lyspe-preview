<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none" stroke="#2a2926" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2926" stroke="none"/></marker></defs>
  <rect x="2" y="2" width="596" height="296" rx="16" fill="#f6f4ec" stroke="#8a867c" stroke-width="2"/>
  <text data-draw="1" x="24" y="80" font-family="sans-serif" font-size="32" font-weight="700" fill="#5f5b52" stroke="none">5 × 5 = 25</text>
  <line data-draw="2" x1="274" y1="68" x2="316" y2="68" stroke-width="2.5" marker-end="url(#ar)"/>
  <text data-draw="3" x="326" y="80" font-family="sans-serif" font-size="32" font-weight="700" fill="#2a2926" stroke="none">5 는 25 의 제곱근</text>
  <text data-draw="4" x="24" y="170" font-family="sans-serif" font-size="32" font-weight="700" fill="#5f5b52" stroke="none">(−5) × (−5) = 25</text>
  <line data-draw="5" x1="274" y1="158" x2="316" y2="158" stroke-width="2.5" marker-end="url(#ar)"/>
  <text data-draw="6" x="326" y="170" font-family="sans-serif" font-size="32" font-weight="700" fill="#2a2926" stroke="none">−5 도 25 의 제곱근</text>
  <text data-draw="7" x="300" y="258" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5f5b52" stroke="none">제곱해서 25 가 되는 수 = 25 의 제곱근</text>
</svg>
